services:
  social-stats:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-stats-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - ./config:/app/config:ro
      - ./public:/app/public:ro
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
