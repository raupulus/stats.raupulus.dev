services:
  social-stats:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-stats-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - ${CONFIG_DIR:-./config}:/app/config:ro
      - ./public:/app/public:ro
      - ${DATA_DIR:-./data}:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    stop_grace_period: 15s
