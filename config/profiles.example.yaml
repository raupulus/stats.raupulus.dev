version: "1.0"

profiles:
  raupulus:
    name: "Perfil Personal (raupulus)"
    description: "Redes sociales principales y canales de contenido personal"
    accounts:
      youtube:
        - id: "UCxxxxxxxxxxxxxxxxxxxxxx"
          handle: "@raupulus"
          label: "Canal Principal"
          enabled: true
        - id: "UCyyyyyyyyyyyyyyyyyyyyyy"
          handle: "@raupulus_live"
          label: "Canal Secundario / Directos"
          enabled: true

      twitter:
        - handle: "raupulus"
          label: "X / Twitter Personal"
          enabled: true

      instagram:
        - handle: "raupulus"
          label: "Instagram Personal"
          credentials_ref: "MAIN"
          enabled: true

      bluesky:
        - handle: "raupulus.dev"
          label: "Bluesky Personal"
          enabled: true

      mastodon:
        - instance: "mastodon.social"
          handle: "raupulus"
          label: "Mastodon Principal"
          enabled: true

      tiktok:
        - handle: "raupulus"
          label: "TikTok Personal"
          enabled: true

      linkedin:
        - handle: "raupulus"
          account_type: "personal"
          label: "LinkedIn Personal"
          enabled: false

  proyecto_secundario:
    name: "Proyecto Secundario"
    description: "Métricas de redes del proyecto secundario"
    accounts:
      youtube:
        - id: "UCzzzzzzzzzzzzzzzzzzzzzz"
          handle: "@proyecto_secundario"
          label: "Canal del Proyecto"
          enabled: true
      twitter:
        - handle: "proyecto_sec"
          label: "Twitter del Proyecto"
          enabled: true
      bluesky:
        - handle: "proyecto.bsky.social"
          label: "Bluesky del Proyecto"
          enabled: true
      mastodon:
        - instance: "fosstodon.org"
          handle: "proyecto"
          label: "Mastodon del Proyecto"
          enabled: true
