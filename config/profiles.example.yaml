version: "1.0"

profiles:
  raupulus:
    name: "Perfil Personal (raupulus)"
    description: "Redes sociales principales, canales de contenido, keycounter y cripto"
    enable: true
    public: true
    accounts:
      youtube:
        - id: "UCxxxxxxxxxxxxxxxxxxxxxx"
          handle: "@raupulus"
          label: "Canal Principal"
          enable: true
          public: true
          interval_minutes: 5
        - id: "UCyyyyyyyyyyyyyyyyyyyyyy"
          handle: "@raupulus_live"
          label: "Canal Secundario / Directos"
          enable: true
          public: true
          interval_minutes: 10

      twitter:
        - handle: "raupulus"
          label: "X / Twitter Personal"
          enable: true
          public: true
          interval_minutes: 10

      instagram:
        - handle: "raupulus"
          label: "Instagram Personal"
          credentials_ref: "MAIN"
          enable: true
          public: true
          interval_minutes: 15

      bluesky:
        - handle: "raupulus.dev"
          label: "Bluesky Personal"
          enable: true
          public: true
          interval_minutes: 2

      mastodon:
        - instance: "mastodon.social"
          handle: "raupulus"
          label: "Mastodon Principal"
          enable: true
          public: true
          interval_minutes: 3

      tiktok:
        - handle: "raupulus"
          label: "TikTok Personal"
          enable: true
          public: true
          interval_minutes: 15

      linkedin:
        - handle: "raupulus"
          account_type: "personal"
          label: "LinkedIn Personal"
          enable: false
          public: true
          interval_minutes: 60

      github:
        - handle: "raupulus"
          label: "GitHub Personal"
          enable: true
          public: true
          interval_minutes: 15

      gitlab:
        - instance: "gitlab.com"
          handle: "raupulus"
          label: "GitLab Personal"
          enable: true
          public: true
          interval_minutes: 15

      telegram:
        - handle: "raupulus_diffusion"
          label: "Canal de Telegram"
          enable: true
          public: true
          interval_minutes: 5

      twitch:
        - handle: "raupulus"
          label: "Twitch Directos"
          enable: true
          public: true
          interval_minutes: 3

      facebook:
        - handle: "raupulus"
          label: "Facebook Público"
          credentials_ref: "MAIN"
          enable: true
          public: true
          interval_minutes: 30

      keycounter:
        - handle: "raupulus"
          label: "Keycounter Principal (Teclado + Ratón)"
          credentials_ref: "MAIN"
          enable: true
          public: true
          interval_minutes: 1

      crypto:
        - handle: "BTC"
          label: "Bitcoin (BTC)"
          enable: true
          public: true
          interval_minutes: 1
        - handle: "ADA"
          label: "Cardano (ADA)"
          enable: true
          public: true
          interval_minutes: 1

  proyecto_secundario:
    name: "Proyecto Secundario"
    description: "Métricas de redes del proyecto secundario"
    enable: true
    public: true
    interval_minutes: 15
    accounts:
      youtube:
        - id: "UCzzzzzzzzzzzzzzzzzzzzzz"
          handle: "@proyecto_secundario"
          label: "Canal del Proyecto"
          enable: true
          public: true
          interval_minutes: 15
      twitter:
        - handle: "proyecto_sec"
          label: "Twitter del Proyecto"
          enable: true
          public: true
          interval_minutes: 15
      bluesky:
        - handle: "proyecto.bsky.social"
          label: "Bluesky del Proyecto"
          enable: true
          public: true
          interval_minutes: 5
      mastodon:
        - instance: "fosstodon.org"
          handle: "proyecto"
          label: "Mastodon del Proyecto"
          enable: true
          public: true
          interval_minutes: 5
