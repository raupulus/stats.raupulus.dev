[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-stats"
version = "0.1.0"
description = "Read-Only REST API and WebSockets server for real-time social media statistics monitoring"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Raúl Caro Pastorino", email = "public@raupulus.dev" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx[http2]>=0.27.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.1",
    "curl_cffi>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
social-stats = "social_stats.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/social_stats"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["social_stats"]

[[tool.mypy.overrides]]
module = ["curl_cffi.*", "aiosqlite.*"]
ignore_missing_imports = true
