<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgBeam" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050f1c"/>
      <stop offset="42%" stop-color="#091421"/>
      <stop offset="56%" stop-color="#19385c"/>
      <stop offset="74%" stop-color="#0d1b2c"/>
      <stop offset="100%" stop-color="#050f1c"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4cd6ff"/>
      <stop offset="50%" stop-color="#3272b8"/>
      <stop offset="100%" stop-color="#a3c9ff"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0" y1="10" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4cd6ff"/>
      <stop offset="100%" stop-color="#007a96" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="16" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a3c9ff"/>
      <stop offset="100%" stop-color="#3272b8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Base biselada azul abisal -->
  <rect width="64" height="64" rx="15" fill="url(#bgBeam)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.72"/>

  <!-- Esquinas técnicas de telemetría -->
  <path d="M7 15V9C7 7.89543 7.89543 7 9 7H15" stroke="#4cd6ff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M57 15V9C57 7.89543 56.1046 7 55 7H49" stroke="#4cd6ff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M7 49V55C7 56.1046 7.89543 57 9 57H15" stroke="#3272b8" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M57 49V55C57 56.1046 56.1046 57 55 57H49" stroke="#3272b8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Anillo de radar / nodo central -->
  <circle cx="32" cy="34" r="19" stroke="#3272b8" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="3 2.5"/>
  <circle cx="32" cy="34" r="14.5" fill="#091421" fill-opacity="0.85" stroke="url(#ringGrad)" stroke-width="1.5"/>

  <!-- Barras verticales de espectro de telemetría -->
  <rect x="17" y="25" width="3" height="16" rx="1.5" fill="url(#barBlue)"/>
  <rect x="22" y="18" width="3" height="23" rx="1.5" fill="url(#barCyan)"/>
  <rect x="27" y="13" width="3.2" height="28" rx="1.6" fill="url(#barBlue)"/>
  <rect x="33.8" y="11" width="3.2" height="30" rx="1.6" fill="url(#barCyan)"/>
  <rect x="39" y="17" width="3" height="24" rx="1.5" fill="url(#barBlue)"/>
  <rect x="44" y="23" width="3" height="18" rx="1.5" fill="url(#barCyan)"/>

  <!-- Hexágono isométrico central (Nodo de red) -->
  <polygon points="32,21 43,27.5 43,40.5 32,47 21,40.5 21,27.5" fill="#050f1c" fill-opacity="0.88" stroke="#4cd6ff" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M21 27.5L32 34L43 27.5M32 34V47" stroke="#a3c9ff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- Pulso luminoso central -->
  <circle cx="32" cy="34" r="3.4" fill="#4cd6ff"/>
  <circle cx="32" cy="34" r="1.6" fill="#f8f9ff"/>
</svg>
